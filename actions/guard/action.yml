name: CodeGuardian guard
description: Set the config-guard commit status (fails when a change edits the gate). Holds a GitHub token, never the model key.
inputs:

  pr-number:
    description: Pull request number (verified against head-sha before use)
    required: true
  head-sha:
    description: Head SHA from the workflow_run event
    required: true
  github-token:
    description: "Token with statuses: write and pull-requests: read"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Set up CodeGuardian (standard library only for this step)
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m venv "$RUNNER_TEMP/cg-venv"
    - name: Run
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../src
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}

      run: |
        "$RUNNER_TEMP/cg-venv/bin/python" -m codeguardian guard --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
